name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            flags: ""
          - config: Sanitizers
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
    env:
      SDL_VERSION: "3.4.10"
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-24.04-headless

      # The tests and the CI build run headless, so SDL is built without
      # X11/Wayland (its offscreen and dummy drivers are always present).
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-${SDL_VERSION} https://github.com/libsdl-org/SDL /tmp/sdl-src
          cmake -S /tmp/sdl-src -B /tmp/sdl-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DCMAKE_INSTALL_PREFIX=$HOME/sdl3
          cmake --build /tmp/sdl-build -j"$(nproc)"
          cmake --install /tmp/sdl-build

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config == 'Release' && 'Release' || 'Debug' }} \
            -DCMAKE_PREFIX_PATH=$HOME/sdl3 \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra ${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
