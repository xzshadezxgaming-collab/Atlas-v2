name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Core tests
        working-directory: tests/StrainEmpire.Core.Tests
        run: dotnet test --logger "console;verbosity=normal"

      - name: Gameplay/Editor compile check (against UnityStubs, not real Unity)
        working-directory: tests/StrainEmpire.Gameplay.CompileCheck
        run: dotnet build
