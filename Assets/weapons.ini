; Atlas weapon definitions.
; Values here override the engine's built-in defaults, so you can tune
; the guns without recompiling. Add a new [Section] to create a weapon.
;
; Keys: Kind (Gun|Digger), FireRate, ClipSize (0 = infinite), ReloadTime,
;       MuzzleVelocity, Spread (degrees), Damage, Power (terrain
;       penetration), Pellets, Recoil, BarrelLength, DigRadius, DigRange

[SMG]
FireRate = 9
ClipSize = 30
ReloadTime = 1.6
MuzzleVelocity = 900
Spread = 4
Damage = 9
Power = 7
Pellets = 1
Recoil = 40
BarrelLength = 14

[Shotgun]
FireRate = 1.4
ClipSize = 6
ReloadTime = 2.2
MuzzleVelocity = 750
Spread = 9
Damage = 7
Power = 5
Pellets = 7
Recoil = 170
BarrelLength = 16

[Rifle]
FireRate = 2.5
ClipSize = 8
ReloadTime = 1.8
MuzzleVelocity = 1400
Spread = 0.7
Damage = 30
Power = 22
Pellets = 1
Recoil = 90
BarrelLength = 20

; Dig tools erode: DigPower is the material-strength budget per tick
; (dirt costs 1.5/px, stone 8/px), MaxDigStrength is the hardest
; material the tool can touch at all.

[Digger]
Kind = Digger
FireRate = 24
DigRadius = 7.5
DigRange = 115
DigPower = 52
BarrelLength = 12

[Shovel]
Kind = Shovel
FireRate = 2
DigRadius = 15
DigRange = 58
DigPower = 420
MaxDigStrength = 5
BarrelLength = 17

[EnemyGun]
FireRate = 5
ClipSize = 0
MuzzleVelocity = 780
Spread = 6
Damage = 6
Power = 5
Recoil = 30
BarrelLength = 14
