; Dig tools erode: DigPower is the material-strength budget per tick
; (Grass/Dirt cost 1.0-1.5/px, Stone 8/px, Gold 5/px before
; multipliers). MaxDigStrength is the hardest material the tool can
; touch AT ALL (gated on the material's real strength, unaffected by
; the cost multipliers below). HardMaterialCost/SoftMaterialCost
; multiply the effective budget cost for Stone+Gold / Grass+Dirt
; respectively - below 1.0 means that tool is cheaper (faster)
; against that category, above 1.0 means slower. Destroying Gold
; pays out currency (see Material.h) regardless of which tool did it.

[Digger]
; Rock/ore specialist - cheap on stone & gold, pricier on dirt.
Kind = Digger
FireRate = 24
DigRadius = 7.5
DigRange = 115
DigPower = 52
HardMaterialCost = 0.35
SoftMaterialCost = 1.6
BarrelLength = 12
Cost = 50

[Shovel]
; Earthmover - cheap on dirt/grass, physically can't touch stone or
; gold (MaxDigStrength sits below Gold's strength of 5.0).
Kind = Shovel
FireRate = 2
DigRadius = 15
DigRange = 58
DigPower = 420
MaxDigStrength = 3
SoftMaterialCost = 0.7
BarrelLength = 17
Cost = 35

