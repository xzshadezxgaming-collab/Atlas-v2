; Atlas weapon definitions.
; Values here override the engine's built-in defaults, so you can tune
; the guns without recompiling. Add a new [Section] to create a weapon.
;
; Keys: Kind (Gun|Digger|Shovel|Launcher|Flamer), FireRate, ClipSize
;       (0 = infinite), ReloadTime, MuzzleVelocity, Spread (degrees),
;       Damage, Power (terrain penetration), Pellets, Recoil,
;       BarrelLength, DigRadius, DigRange, LaserSight (0/1),
;       BlastRadius and BlastDamage (launchers), Cost (gold to order
;       from the buy menu; 0 = not for sale)

